<!DOCTYPE html>
<html class="login" lang="zh-CN" data-state="online">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · AgentFleet</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
</head>
<body data-page="login">
<main class="af-auth" tabindex="-1">
  <div class="af-auth__box">
    <div class="af-auth__brand">
      <span class="af-brand__mark" aria-hidden="true"></span>
      <span class="af-t-label">AgentFleet</span>
    </div>
    <div>
      <h1 class="af-auth__title">登录</h1>
      <p class="af-auth__sub" style="margin-top:var(--af-space-3)">
        单用户自托管。密码由首次 setup 设置，不通过邮箱找回——
        忘了就得去机器上重跑 <code>afcli setup</code>。
      </p>
    </div>

    <form id="f" novalidate>
      <div class="af-col gap-5">
        <div class="af-field">
          <label class="af-field__label" for="pw">密码</label>
          <input class="af-input" type="password" id="pw" autocomplete="current-password"
                 aria-describedby="err hint">
          <span class="af-field__hint" id="hint">本地连接时不走 TLS；远程部署请自己套反代。</span>
          <span class="af-field__error" id="err" role="alert" hidden></span>
        </div>
        <button class="af-btn af-btn--primary af-btn--lg" type="submit" style="width:100%">进入控制台</button>
      </div>
    </form>

    <div class="af-hairline"></div>

    <!-- 错误态演示：三种错误必须分开呈现，因为下一步完全不同 -->
    <div class="af-col gap-3">
      <div class="af-t-label">错误态演示（点击切换）</div>
      <div class="af-seg" role="group" aria-label="错误态演示">
        <button class="af-seg__b" type="button" data-err="none" aria-pressed="true">无错</button>
        <button class="af-seg__b" type="button" data-err="bad" aria-pressed="false">密码错</button>
        <button class="af-seg__b" type="button" data-err="init" aria-pressed="false">Hub 未初始化</button>
        <button class="af-seg__b" type="button" data-err="expired" aria-pressed="false">会话失效</button>
        <button class="af-seg__b" type="button" data-err="429" aria-pressed="false">429 限流</button>
      </div>
      <p class="af-field__hint">
        五种情形的<b>下一步动作不同</b>，所以必须分开：密码错可以重试；
        Hub 未初始化要跳 setup；会话失效要重新登录；429 要告诉用户等多久——
        把它们压成一句「登录失败」等于把决定还给用户瞎猜。
      </p>
    </div>

    <div class="af-auth__foot">
      忘了密码？<code>afcli setup --reset-password</code>（需要能登机器）
    </div>
  </div>
</main>

<script src="assets/keynav.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  'use strict';
  var AF = window.AF;
  var $ = function (s) { return document.querySelector(s); };

  /* 认证页不用外壳：登录前没有导航可言。main[tabindex=-1] 仍由 keynav.focusMain 聚焦。 */

  var ERRORS = {
    none: null,
    bad:  { tone: 'danger', msg: '密码不对。剩余尝试次数：4（再错 4 次会被锁定 10 分钟）' },
    init: { tone: 'warn',  msg: 'Hub 还没初始化。请先去机器上运行 afcli setup 完成首次配置。' },
    expired: { tone: 'info', msg: '登录已失效（超过 7 天未活动）。重新登录即可。' },
    '429': { tone: 'warn', msg: '尝试太频繁，10 秒后可重试。连续失败会触发指数退避。' }
  };
  var current = 'none';

  $('[data-err="none"]').parentElement.addEventListener('click', function (e) {
    var b = e.target.closest('[data-err]');
    if (!b) return;
    current = b.dataset.err;
    [].forEach.call(b.parentElement.children, function (o) {
      o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
    });
    applyErr();
  });

  function applyErr() {
    var e = ERRORS[current];
    var err = $('#err');
    if (!e) { err.hidden = true; err.textContent = ''; return; }
    err.hidden = false;
    err.textContent = e.msg;
    $('#pw').setAttribute('aria-invalid', 'true');
    $('#pw').classList.add('af-input--invalid');
    /* 未初始化是不可重试的：它该跳 setup，所以表单禁用 */
    $('#pw').disabled = current === 'init' || current === '429';
  }

  $('#f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (current === 'init') { location.href = 'setup.html'; return; }
    if (!$('#pw').value) { current = 'bad'; applyErr(); return; }
    AF.toast({ tone: 'ok', title: '已登录', text: '欢迎回来。' });
    setTimeout(function () { location.href = 'sessions.html'; }, 400);
  });
})();
</script>
</body>
</html>
