<!DOCTYPE html>
<html class="sessions" lang="zh-CN" data-state="online">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会话 · AgentFleet</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<style>
  /* 本页两处页面级样式：进行中会话的卡片网格，与面板坞的那排小色块。
     色块只回答「开着几个、哪一类」——面板真正的类型与作用域在会话内部
     才看得见（约束 3：connector 绑定会话的工作区，不是设备级管理面）。 */
  .live { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: var(--af-space-5); }
  .scard {
    display: flex; flex-direction: column; text-decoration: none;
    border: 1px solid var(--af-border-default); border-left: 2px solid var(--af-border-default);
    border-radius: var(--af-radius-md); background: var(--af-surface-1); overflow: hidden;
    transition: border-color var(--af-dur-instant) linear, background-color var(--af-dur-instant) linear;
  }
  .scard:hover { background: var(--af-surface-2); border-color: var(--af-border-strong); }
  .scard[aria-selected='true'] { background: var(--af-accent-bg); border-color: var(--af-accent-line); }
  .scard[data-state='active'] { border-left-color: var(--af-ok); }
  .scard[data-state='disconnected'] { border-left-color: var(--af-warn); }
  .scard[data-state='ended'] { border-left-color: var(--af-border-strong); }
  .scard__head { display: flex; align-items: center; gap: var(--af-space-3); padding: var(--af-space-4) var(--af-space-5); }
  .scard__body { display: flex; flex-direction: column; gap: var(--af-space-3); padding: 0 var(--af-space-5) var(--af-space-4); }
  .scard__foot {
    display: flex; align-items: center; gap: var(--af-space-3); flex-wrap: wrap;
    padding: var(--af-space-3) var(--af-space-5); background: var(--af-surface-2);
    border-top: 1px solid var(--af-border-subtle);
    font-size: var(--af-text-2xs); color: var(--af-fg-tertiary);
  }
  .dockmarks { display: inline-flex; gap: 2px; align-items: center; }
  .dockmarks i { width: 14px; height: 6px; border-radius: 1px; background: var(--af-accent); display: block; }
  .dockmarks i[data-s='files'] { background: var(--af-info); }
  .dockmarks i[data-s='git'] { background: var(--af-agent); }
  .dockmarks i[data-s='closed'] { background: transparent; border: 1px dashed var(--af-border-strong); }
  .shead { display: flex; align-items: center; gap: var(--af-space-4); flex-wrap: wrap; margin-bottom: var(--af-space-8); }
  .shead .af-input { width: 240px; }
</style>
</head>
<body data-page="sessions">
<div data-shell>

  <div class="af-page">

    <div class="af-page__head">
      <div>
        <h1 class="af-page__title">会话</h1>
        <p class="af-page__sub">
          一个会话 = <b>一个 agent 在一台设备的一条工作区路径上的一次运行</b>。
          工作区路径是会话的属性，不是一个能单独打开的地方——所以这一页没有「工作区」这一栏，
          也没有第二条能绕开会话的入口。
        </p>
      </div>
    </div>

    <!-- 新建会话是这一个按钮，不是导航项：放进导航会让用户以为它是一个「地方」，
         于是收藏、后退、直接输 URL 全都变得语义可疑（规范 §1.3 否决项）。 -->
    <div class="shead">
      <a class="af-btn af-btn--primary af-btn--lg" href="new-session.html">
        <span aria-hidden="true">✚</span> 新建会话 <kbd>g n</kbd>
      </a>
      <input class="af-input" type="search" id="q" placeholder="搜标题 / 设备 / agent / 路径"
             aria-label="搜索会话" autocomplete="off" spellcheck="false">
      <span class="af-spacer"></span>
      <span class="af-t-mute" style="font-size:var(--af-text-xs)">
        <kbd>↑</kbd><kbd>↓</kbd> 在列表里走 · <kbd>⏎</kbd> 进入会话 · <kbd>/</kbd> 聚焦顶栏搜索
      </span>
    </div>

    <!-- ============ 进行中 ============ -->
    <section id="sec-live" aria-label="进行中的会话">
      <div class="af-row gap-4" style="margin-bottom:var(--af-space-5)">
        <div class="af-t-label">进行中</div>
        <span class="af-spacer"></span>
        <span class="af-t-mute" style="font-size:var(--af-text-xs)">卡片下方那排小色块 = 这个会话开着的面板</span>
      </div>
      <div class="live" id="live" data-role="list" tabindex="0" role="listbox" aria-label="进行中的会话"></div>
    </section>

    <!-- ============ 历史 ============ -->
    <section id="sec-hist" style="margin-top:var(--af-space-11)" aria-label="历史会话">
      <div class="af-row gap-4" style="margin-bottom:var(--af-space-5)">
        <div class="af-t-label">历史</div>
        <span class="af-spacer"></span>
        <span class="af-t-mute" style="font-size:var(--af-text-xs)">
          断线的会话仍可进去看（只读）；已结束的会话留档轨迹与产物，工作区不再可达。
        </span>
      </div>
      <table class="af-table">
        <thead>
          <tr>
            <th>标题</th>
            <th style="width:110px">设备</th>
            <th style="width:112px">agent</th>
            <th style="width:200px">路径</th>
            <th style="width:104px">状态</th>
            <th style="width:76px" data-num>事件数</th>
            <th style="width:104px">开始时间</th>
          </tr>
        </thead>
        <tbody id="hist" data-role="list" tabindex="0" role="listbox" aria-label="历史会话"></tbody>
      </table>
    </section>

    <!-- 只有「搜索没匹配上」才会出现：这一页有历史，不摆假的空状态 -->
    <div class="af-empty" id="empty" hidden>
      <div class="af-empty__glyph" aria-hidden="true">◌</div>
      <div class="af-empty__title">没有匹配的会话</div>
      <div class="af-empty__text">标题、设备名、agent 名、路径都能匹配。换个词试试。</div>
      <div class="af-empty__actions">
        <button class="af-btn af-btn--sm" type="button" id="clearq">清空搜索</button>
      </div>
    </div>

  </div>

</div>

<script src="assets/keynav.js"></script>
<script src="assets/app.js"></script>
<script>
/* ===========================================================================
   会话列表 —— 全站入口。
   ---------------------------------------------------------------------------
   分工：外壳、键位、列表导航、toast、模态全在 keynav.js / app.js 里。
   这个文件只声明「有哪些会话、一行长什么样」，以及搜索怎么筛。
   =========================================================================== */
(function () {
  'use strict';
  var AF = window.AF;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };

  AF.mount('sessions');

  var DEVICES = AF.mock.devices;
  var SESSIONS = AF.mock.sessions;

  function devOf(id) {
    for (var i = 0; i < DEVICES.length; i++) if (DEVICES[i].id === id) return DEVICES[i];
    return null;
  }
  function devName(id) { var d = devOf(id); return d ? d.name : id; }

  /* =========================================================================
     面板坞缩略
     -------------------------------------------------------------------------
     一个色块 = 一个开着的面板。刻意不画面板名：列表页的密度只承载
     「开着几个」，而类型与作用域必须进会话才看得见（约束 3 的可见性代价）。
     ======================================================================= */
  function dockMarks(list) {
    if (!list || !list.length) {
      return '<span class="dockmarks" aria-label="面板坞关闭"><i data-s="closed"></i></span>';
    }
    return '<span class="dockmarks" aria-label="' + list.length + ' 个面板在开">' +
      list.map(function (k) { return '<i data-s="' + AF.esc(k) + '"></i>'; }).join('') + '</span>';
  }

  /* =========================================================================
     两行形态
     -------------------------------------------------------------------------
     卡片走 <a data-row>：Enter 由 keynav 的 list:enter 走 data-href，
     指针点击走浏览器原生链接，两条路同一个目的地。
     历史行走 <tr data-row data-href>：行里没有 button/a，所以 Enter 落到
     af:enter 之前先被 data-href 接住。
     ======================================================================= */
  function card(s) {
    return '<a class="scard" href="session.html" data-row tabindex="-1" role="option" ' +
        'aria-selected="false" data-state="' + AF.esc(s.status) + '">' +
      '<div class="scard__head">' + AF.stateHTML(s.status) +
        '<span class="af-spacer"></span>' +
        '<span class="af-badge af-badge--agent">' + AF.esc(s.agent) + '</span>' +
      '</div>' +
      '<div class="scard__body">' +
        '<div class="af-truncate" style="font-size:var(--af-text-md);color:var(--af-fg-primary);' +
          'font-weight:var(--af-weight-medium)">' + AF.esc(s.title) + '</div>' +
        '<div class="af-col gap-2" style="font-size:var(--af-text-xs)">' +
          '<div><span class="af-t-mute">设备</span> <span style="color:var(--af-fg-secondary)">' +
            AF.esc(devName(s.device)) + '</span></div>' +
          /* 路径是普通字段，不是可点容器：它是会话的属性，不是一个能单独打开的地方 */ +
          '<div class="af-fp af-truncate" title="' + AF.esc(s.path) + '">' + AF.esc(s.path) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="scard__foot">' + dockMarks(s.panels) +
        '<span>' + (s.panels.length ? s.panels.length + ' 个面板' : '面板坞关闭') + '</span>' +
        '<span class="af-spacer"></span>' +
        '<span class="af-t-num">' + AF.esc(s.events) + '</span><span>事件</span>' +
        '<span class="af-t-mute">·</span><span>' + AF.esc(s.started) + '开始</span>' +
      '</div>' +
    '</a>';
  }

  function histRow(s) {
    return '<tr data-row tabindex="-1" role="option" aria-selected="false" data-href="session.html">' +
      '<td style="color:var(--af-fg-primary)">' + AF.esc(s.title) + '</td>' +
      '<td>' + AF.esc(devName(s.device)) + '</td>' +
      '<td><span class="af-badge af-badge--agent">' + AF.esc(s.agent) + '</span></td>' +
      '<td class="af-fp af-truncate" title="' + AF.esc(s.path) + '">' + AF.esc(s.path) + '</td>' +
      '<td>' + AF.stateHTML(s.status) + '</td>' +
      '<td data-num>' + AF.esc(s.events) + '</td>' +
      '<td class="af-t-mute">' + AF.esc(s.started) + '</td>' +
    '</tr>';
  }

  /* =========================================================================
     渲染与搜索
     -------------------------------------------------------------------------
     「进行中」= status active；其余进历史。断线（disconnected）刻意**不**
     藏进行区：它在设备上还活着，只是 Hub 暂时够不着，进去是只读的。
     ======================================================================= */
  function render() {
    var q = ($('#q').value || '').trim().toLowerCase();
    var all = SESSIONS.filter(function (s) {
      if (!q) return true;
      return [s.title, devName(s.device), s.agent, s.path, s.id].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    var live = all.filter(function (s) { return s.status === 'active'; });
    var hist = all.filter(function (s) { return s.status !== 'active'; });

    $('#live').innerHTML = live.map(card).join('');
    $('#hist').innerHTML = hist.map(histRow).join('');
    $('#sec-live').hidden = !live.length;
    $('#sec-hist').hidden = !hist.length;
    $('#empty').hidden = !!(live.length || hist.length);
  }

  /* 指针点击补上与 Enter 同一条路：行激活的语义只有一处（keynav 的 list:enter），
     这里只是让鼠标也落到那个语义上，而不是另写一套跳转。 */
  $('#hist').addEventListener('click', function (e) {
    var row = e.target.closest('[data-row]');
    if (row) location.href = row.dataset.href;
  });

  $('#q').addEventListener('input', render);
  $('#clearq').addEventListener('click', function () {
    $('#q').value = '';
    render();
    $('#q').focus();
  });

  render();

  /* 自检：表里有、本页没实现的 act 会在控制台列出来，而不是等用户按到死键 */
  if (AF.unimplemented().length) {
    console.warn('[sessions] 本页未实现的 act（会话工作台与面板专属，属预期）：',
      AF.unimplemented().join(', '));
  }
})();
</script>
</body>
</html>
