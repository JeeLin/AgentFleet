[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/identity",
    "crates/hub-storage",
    "crates/hub-core",
    "crates/hub-server",
    "crates/node-core",
    "crates/node-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JeeLin/AgentFleet"

[workspace.dependencies]
# 内部
protocol = { path = "crates/protocol" }
identity = { path = "crates/identity" }
hub-storage = { path = "crates/hub-storage" }
hub-core = { path = "crates/hub-core" }
node-core = { path = "crates/node-core" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# WebSocket
tokio-tungstenite = "0.24"

# HTTP / WS 服务端
axum = { version = "0.8", features = ["ws"] }
# `util` 给 `ServiceExt::oneshot`——集成测试里不起真端口直接打路由
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# SQLite（rusqlite 同步驱动，配 r2d2 连接池；不引 sqlx 的异步宏）
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# 密码学
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
argon2 = { version = "0.5", features = ["std"] }
base64ct = "1"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"

# 错误与日志
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工具
bytes = "1"
parking_lot = "0.12"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
# umask(077)（约束 13）：Rust 标准库没有 umask 绑定
libc = "0.2"
# 节点自更新下载用（§7.1.3）：rustls-tls，不依赖系统 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# 仅测试用（放在这里而不是独立 section：`dep.workspace = true` 只从
# `[workspace.dependencies]` 继承，Cargo 没有 `[workspace.dev-dependencies]`）
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# 全 workspace 统一的 lint 策略。子 crate 用 `[lints] workspace = true` 继承。
[workspace.lints.clippy]
# 生产代码禁止 unwrap/expect/panic：这些一触发就是进程级退出，
# 而 Hub 是常驻服务、node 是无人值守守护进程——不该因为一处
# 「不可能失败」的假设把整台设备带下去。
# 例外只有两种：`#[cfg(test)]` 内（测试本来就可以 panic），
# 以及显式标注 `// coverage: excluded — <理由>` 的不可达兜底。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# `unwrap_or_default` 也禁：它把「取不到」静默变成「空值」，
# 掩盖了本该上报的错误（例：时钟回拨时 `duration_since` 失败）。
unwrap_or_default = "deny"
# 索引越界 panic：一律用 get() + 错误分支。
indexing_slicing = "deny"
# 静默丢错：`let _ = fallible()` 会吞掉本该传播的错误。
let_underscore_must_use = "deny"
# 不启用 arithmetic_side_effects：它连 `i += 1` / `len() * 2` 都命中，
# 开启只会得到满屏 allow，反而淹没有意的溢出点。溢出防护靠
# `overflow-checks`（debug 默认开）+ 针对性测试，不靠 lint 噪声。
