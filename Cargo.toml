[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/identity",
    "crates/hub-storage",
    "crates/hub-core",
    "crates/hub-server",
    "crates/node-connector",
    "crates/node-core",
    "crates/node-cli",
]

[workspace.package]
version = "0.7.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JeeLin/AgentFleet"

[workspace.dependencies]
# 内部
protocol = { path = "crates/protocol" }
identity = { path = "crates/identity" }
hub-storage = { path = "crates/hub-storage" }
hub-core = { path = "crates/hub-core" }
hub-server = { path = "crates/hub-server" }
node-connector = { path = "crates/node-connector" }
node-core = { path = "crates/node-core" }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 异步运行时
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# WebSocket
tokio-tungstenite = "0.24"

# HTTP / WS 服务端
axum = { version = "0.8", features = ["ws"] }
# `util` 给 `ServiceExt::oneshot`——集成测试里不起真端口直接打路由
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }

# SQLite（rusqlite 同步驱动，配 r2d2 连接池；不引 sqlx 的异步宏）
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# 密码学
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
argon2 = { version = "0.5", features = ["std"] }
base64ct = { version = "1", features = ["alloc", "std"] }
sha2 = "0.10"
hmac = "0.12"
subtle = "2"

# 错误与日志
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 工具
bytes = "1"
parking_lot = "0.12"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
# umask(077)（约束 13）：Rust 标准库没有 umask 绑定
libc = "0.2"
# Windows 侧系统调用（v0.7.2）：ConPTY 要 `CreatePseudoConsole` /
# `ResizePseudoConsole`，命令执行要 `CreateProcessW` + 句柄继承，文件
# connector 要 `SetFileTime`。全部只在 `cfg(windows)` 分支用到。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }
# terminal connector 的真 PTY（里程碑子任务 8）。
# 只用 libc 自己那套 `openpty` / `forkpty` / `ioctl(TIOCSWINSZ)` 就够，
# 不引 `portable-pty` / `nix`：`portable-pty` 会把 **spawn 与读循环一起**
# 塞进它的 `MasterPty`，而本项目的数据泵必须住在 node 的 tokio 读循环里
# （同一任务里同时等 WS 与 PTY，约束 8 的「不阻塞心跳」），并在
# `forkpty` 之后于子进程里补 execve —— portable-pty 的 Command 封装做不了这件事。
# 手写 60 行 fork/exec 的代价，换来的是「零新增依赖」与全量可测的字节搬运层。
# 节点自更新下载用（§7.1.3）：rustls-tls，不依赖系统 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# 静态资产内嵌（子任务 6）：`include_dir!` 把 `packages/web/dist` 编进 Hub
# 二进制。不引 `rust-embed`：它附带的压缩与动态加载能力在本项目用不上，
# 而 `include_dir` 的语义就是「编译期目录树」，与「运行时不需要 dist」直接对应。
include_dir = "0.7"

# 仅测试用（放在这里而不是独立 section：`dep.workspace = true` 只从
# `[workspace.dependencies]` 继承，Cargo 没有 `[workspace.dev-dependencies]`）
# Windows 侧 ConPTY / 进程 / 文件 API（v0.7.2）。只在 `cfg(windows)` 下编译，
# 所以 Linux/macOS 构建不会拉它进来。
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# 全 workspace 统一的 lint 策略。子 crate 用 `[lints] workspace = true` 继承。
[workspace.lints.clippy]
# 生产代码禁止 unwrap/expect/panic：这些一触发就是进程级退出，
# 而 Hub 是常驻服务、node 是无人值守守护进程——不该因为一处
# 「不可能失败」的假设把整台设备带下去。
#
# 唯一的例外是「测试代码」——那里 unwrap 失败就该炸，且 panic 消息比
# match 分支更能说明是哪一行、哪个值不对。这条例外**不靠手写 `#[allow]`**，
# 而由根目录 `clippy.toml` 的 `allow-*-in-tests` 承担（单元测试与
# `tests/` 集成测试都生效），因此生产代码这边保持 `deny` 不变。
# 生产代码里唯一允许的例外是显式标注 `// coverage: excluded — <理由>`
# 的不可达兜底。
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# ⚠️ 这里**不要**再写 `unwrap_or_default = "deny"`：clippy 根本没有这条规则
# （`cargo clippy --explain unwrap_or_default` 查到的是「`unwrap_or(Default::default())`
# 该写成 `unwrap_or_default()`」，方向正好相反）。它曾在这行躺了很久，让 8 处
# 生产调用看起来「被门禁管着」而实际一个都没被拦。
# 真正的门禁是 `scripts/check.sh` 的 C4：grep 生产代码里的 `unwrap_or_default`。
# 索引越界 panic：一律用 get() + 错误分支。
indexing_slicing = "deny"
# ⚠️ `let_underscore_must_use` 已移除，且**没有**在 `clippy.toml` 里补回来。
#
# 理由：Clippy 官方只有 8 个 `*-in-tests` 配置项，不含它——也就无法
# 像上面四条那样「工具级放行测试、deny 生产代码」。二选一只有：
#   a) 为此保留一条规则，代价是全仓 21 个测试文件每个都得手写
#      `#[allow(clippy::let_underscore_must_use)]`（还会抄漏）；
#   b) 去掉这条规则，测试里 `let _ =` 不再被拦。
# 选 b，因为这条规则在**测试**里几乎没有价值：测试本来就在验证「某条路径
# 成不成立」，`let _ =` 丢掉一个错误正是「失败不影响状态」的常规写法；
# 而它真正要拦的是**生产代码**里吞错——但生产代码那条由覆盖率门禁与
# 上面四条 deny 兜住了大半。
# 不启用 arithmetic_side_effects：它连 `i += 1` / `len() * 2` 都命中，
# 开启只会得到满屏 allow，反而淹没有意的溢出点。溢出防护靠
# `overflow-checks`（debug 默认开）+ 针对性测试，不靠 lint 噪声。
