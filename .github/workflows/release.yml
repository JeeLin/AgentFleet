# 发布通路：打 tag（`vX.Y.Z`）即产出二进制、镜像与 GitHub Release。
#
# **这是本仓唯一的 workflow。** 曾经的 `ci.yml` 已删除（v0.7.1）：它与本文件
# 同触发并行，门禁红时镜像照样推上去（Bug #17）；而本文件的 `gate` job 已经把
# 全部门禁跑了一遍，`ci.yml` 是纯重复。现在门禁**就在产线里**，唯一权威是
# `mise.toml` 的 `[tasks.ci].depends`，`scripts/check.sh` 的 C7 双向比对
# 「mise 定义了哪些门禁」与「本文件的 gate 跑了哪些」。
#
# 代价如实记录：门禁红时不再有独立的 `CI` run 告诉你哪条挂了——只能看 `gate`
# job 的步骤名（`cov-gate（mise run cov-gate）` 之类）。信息没丢，只是换了位置。
# `cov-gate` 与本地 `mise run cov-gate` 是同一条 ≥98% 硬判据：失败会让 gate job
# 判 failure，下游产物 / 镜像 / Release 全部 skipped，没有例外。
#
# 工具链版本仍然只从 `mise.toml [tools]` 读：覆盖率数值跨工具链不可比，
# 版本写两处迟早只改一处。
name: Release

on:
  push:
    tags: ['v*']
  # 手动补发（tag 已存在但某一步失败时用，不必删 tag 重打）：
  # 输入一个已存在的 tag 名即可。
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（已存在，如 v0.7.1）'
        required: true
        type: string

# 最小权限：Release 要写仓库内容、镜像要写 GHCR。不加多余的 token 权限。
permissions:
  contents: write
  packages: write

# 同一 tag 的重复触发（手动补发）串行化，避免两条流水线同时往同一个 Release 里传文件。
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # 由 `on.push.tags` 或 `workflow_dispatch` 二选一而来，下游一律读它。
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------------------
  # 0. 闸：产线自己等门禁，不靠「tag 只在本地全绿后才打」这条人工纪律
  # ---------------------------------------------------------------------------
  # 曾经两个 workflow（`ci.yml` 与 `release.yml`）**只共享触发、互不阻塞**：
  # 并行跑，门禁红时镜像照样推上 GHCR、Release 照样建，`latest` 一旦被污染，
  # 所有 `docker pull :latest` 的自托管用户直接升到坏版本（v0.7.1 首次真跑 CI
  # 时实测到两个 run 并行启动，Bug #17）。当时的防线是「tag 只在 `mise run ci`
  # 全绿后才打」——但纪律挡不住手工 `git tag` + `git push`，也挡不住
  # `workflow_dispatch` 补发（那条路径完全不经过本地门禁）。
  #
  # 所以把门禁搬进产线本身（并把重复的 `ci.yml` 删掉）：产线跑
  # `mise.toml [tasks.ci]` 定义的**全部**门禁，下面每一个产线 job 都 `needs` 它。
  # 清单只有一处，C7 双向比对产线的步骤名。
  #
  # 为什么不用 `workflow_run` 串联两个 workflow：`workflow_run` 的事件上下文
  # 是「另一个 workflow 跑完了」，**拿不到原始 tag 的 `github.ref` /
  # `github.ref_name`**；而抽 `CHANGELOG` body、镜像 tag、`gh release
  # --verify-tag` 全都要 tag 名，得再从 API 反查并层层传递，多一层间接、多一个
  # 失败面。代价是 tag 推上去后门禁才跑（覆盖率那步最贵），换的是坏产物发不出去。
  #
  # 为什么拆成 4 个 job 而不是一个串行 job：同一 job 内的步骤**永远串行**，
  # 无法并发。`test`（约 5.5m）与 `cov-gate`（全量插桩，约 10m+）用的是两套
  # 二进制（插桩产物不能复用普通产物），`web-ci` 与 Rust 侧零交集——这三条
  # 之间本来没有数据依赖；现在只为复用缓存 / dist 加两条轻量 `needs`
  # （gate-test 等 gate-static、gate-coverage 等 gate-web），其余仍并行，
  # wall clock 仍接近「最长那条」。
  #
  # Rust 重编译更贵：`gate-static` 写普通 debug 缓存，`gate-test` 等它并只读；
  # Linux 发布矩阵与桌面 build/test 各按 target 共用稳定缓存（对齐 REX）。
  # 桌面 `test-desktop` 仍在 release profile 真跑，只复用 `build-desktop` 的依赖图。
  #
  # 前端 dist 也只编一次：`gate-web` 产出 `web-dist` artifact，覆盖率与发布链下载复用。
  # `build-frontend` 仍是硬前置，负责校验缺 dist 时 `include_dir!` 不会编出占位页 Hub。
  #
  # ---- 4 个 job 共用的环境脚手架（每个 job 重复一遍是 Actions 的形态税）----
  # 步骤名里的 `（mise run <task>）` 是 `check.sh` C7 的解析锚点：C7 扫描
  # gate-static / gate-test / gate-coverage / gate-web 四个 job 的步骤**合集**
  # 与 `[tasks.ci].depends` 双向比对，改名会红，漏一条也会红。

  gate-static:
    runs-on: ubuntu-24.04
    # 只跑门禁，不推任何东西。顶层 `permissions` 是给 `docker-hub` /
    # `docker-node`（推 GHCR）与 `release`（建 Release）的，**不能让它漏到这里**：
    # 一个只跑 `cargo test` / `bun run build` 的 job 手里握着能改仓库内容与推包的
    # token，某个依赖的 build script 或测试被投毒就能借这条 job 的 token 推东西。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: 读工具链版本（mise.toml [tools] 是唯一出处）
        id: tools
        run: |
          set -euo pipefail
          for t in node bun rust; do
            v=$(sed -nE "s/^${t} = \"([^\"]+)\".*/\1/p" mise.toml | head -1)
            [ -n "$v" ] || { echo "mise.toml 里读不到 $t 的版本" >&2; exit 1; }
            echo "$t=$v" >> "$GITHUB_OUTPUT"
          done

      - name: 装 Rust ${{ steps.tools.outputs.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.rust }}
          # **必须显式列全部组件**：本地跑门禁时 `mise` 会自动补装缺的组件，
          # 而 CI 里 `cargo` 来自这个 action（`--profile minimal`，只装列出的），
          # 缺什么就真的没有。
          #   - rustfmt：`fmt` 门禁（`cargo fmt --check`）
          #   - clippy：`lint` 门禁（`cargo clippy -- -D warnings`）
          # 首次真跑 CI 实测：只写 llvm-tools-preview 时 `fmt` 一步
          # `error: 'cargo-fmt' is not installed for the toolchain`，
          # 而本地全绿——这类「本地绿、CI 红」的差异只能靠列全躲开。
          components: rustfmt, clippy

      - name: 装工具链版本缓存（cargo 编译产物按 Cargo.lock 键控）
        uses: Swatinem/rust-cache@v2
        with:
          # 普通 debug 依赖图由本 job 写；gate-test 等它并只读，避免各自从零编译。
          shared-key: gate-linux
          save-if: true

      - name: check（mise run check）
        run: scripts/check.sh

      - name: fmt（mise run fmt）
        run: cargo fmt --check

      - name: lint（mise run lint）
        run: cargo clippy --workspace --all-targets -- -D warnings

  gate-test:
    needs: [gate-static]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: 读工具链版本（mise.toml [tools] 是唯一出处）
        id: tools
        run: |
          set -euo pipefail
          v=$(sed -nE 's/^rust = "([^"]+)".*/\1/p' mise.toml | head -1)
          [ -n "$v" ] || { echo "mise.toml 里读不到 rust 的版本" >&2; exit 1; }
          echo "rust=$v" >> "$GITHUB_OUTPUT"

      - name: 装 Rust ${{ steps.tools.outputs.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.rust }}
          # `cargo test` 只需 rustc + rust-std（minimal 自带），但 test 目录里有
          # 编译期断言用到 `rustfmt` 的内容曾属误判——这里如实只装必需的；
          # 真缺组件时门禁红得明明白白（C8 会先拦住 gate-static 那种遗漏）。
          components: rustfmt

      - name: 装工具链版本缓存（cargo 编译产物按 Cargo.lock 键控）
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: gate-linux
          save-if: false

      - name: test（mise run test）
        run: cargo test --workspace

  gate-coverage:
    needs: [gate-web]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # 覆盖率门禁要与本地同态：本地检出通常有 `packages/web/dist`。这里下载
      # `gate-web` 唯一一次构建的 dist，不再重复 `bun install` + `bun run build`。
      - name: 取回前端产物
        uses: actions/download-artifact@v6
        with:
          name: web-dist
          path: packages/web/dist

      - name: 校验 dist（覆盖率与本地同态）
        run: |
          set -euo pipefail
          test -f packages/web/dist/index.html \
            || { echo "packages/web/dist/index.html 不在位" >&2; exit 1; }

      - name: 读工具链版本（mise.toml [tools] 是唯一出处）
        id: tools
        run: |
          set -euo pipefail
          v=$(sed -nE 's/^rust = "([^"]+)".*/\1/p' mise.toml | head -1)
          [ -n "$v" ] || { echo "mise.toml 里读不到 rust 的版本" >&2; exit 1; }
          echo "rust=$v" >> "$GITHUB_OUTPUT"

      - name: 装 Rust ${{ steps.tools.outputs.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.rust }}
          # cargo llvm-cov 靠 llvm-tools 出插桩与报告，缺它门禁直接 FATAL
          components: llvm-tools-preview

      - name: 装 cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # 覆盖率门禁要全量插桩 + 链接峰值，脚本要求 ≥6 GiB 空闲磁盘，
      # runner 默认镜像里的 .NET / GHC 体积大，先清掉。
      # （只有这个 job 需要：test 用普通二进制，没有 6G 的要求。）
      - name: 腾磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: 装工具链版本缓存（cargo 编译产物按 Cargo.lock 键控）
        uses: Swatinem/rust-cache@v2
        with:
          # llvm-cov 用独立的 target 目录（CARGO_TARGET_TARGET_DIR 注入），
          # 与 test/static 的缓存天然隔离，靠 prefix 区分即可。
          prefix-key: v1-gate-coverage

      # 覆盖率门禁：行覆盖率 ≥98%。**CI 里唯一的覆盖率步骤**（v0.7.2 起），
      # 与本地 `mise run cov-gate` 跑同一条命令，不是两套判据。
      #
      # 此前这里是两道：`scripts/check-coverage.sh`（零未登记未覆盖行 +
      # 例外表双向核对）与 `scripts/coverage-exceptions.sh --check`（例外理由
      # 锚点核对）。已连同 `coverage-exceptions.txt`、`scripts/check-coverage.sh`、
      # `scripts/coverage-exceptions.sh`、`scripts/uncovered-lines.sh` 一起移除。
      #
      # 移除的实据：例外表用**行号**索引源码，每加一行都要手工同步整张表
      #（676 条）。本里程碑内 4 个提交移动了行号而无人同步，锚点门禁从 PASS
      # 回归到 FAIL（12 条孤儿标注）；而 `bash scripts/check.sh` 不调用它，
      # 于是本地判「全绿」是假绿——那正是这次要消灭的失败模式。
      #
      # ⚠️ 已知代价，写在这里而不是藏着：98% 是**总量**判据，比原来的
      #「每条未覆盖行都要有理由」**更弱**。整块新增未测试代码可以靠既有
      # 总量稀释掉。v0.7.3 已补测试到实跑 98.02%，并撤掉 step 级临时豁免：
      # 命令与 `needs` 都不动，覆盖率失败即阻断发布。
      - name: cov-gate（mise run cov-gate）
        run: cargo llvm-cov --workspace --all-targets --summary-only --fail-under-lines 98

  gate-web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: 读工具链版本（mise.toml [tools] 是唯一出处）
        id: tools
        run: |
          set -euo pipefail
          for t in node bun; do
            v=$(sed -nE "s/^${t} = \"([^\"]+)\".*/\1/p" mise.toml | head -1)
            [ -n "$v" ] || { echo "mise.toml 里读不到 $t 的版本" >&2; exit 1; }
            echo "$t=$v" >> "$GITHUB_OUTPUT"
          done

      - name: 装 Node ${{ steps.tools.outputs.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.tools.outputs.node }}
          # setup-node v5 起，若 package.json 里有 `packageManager` 字段就**自动开缓存**。
          # 这里的包管理器是 **bun**（`bun install --frozen-lockfile`），bun 的锁文件
          # 与 npm 的缓存格式不通用——让 setup-node 去猜缓存只会写出无效条目。
          # 显式关掉：缓存的真相源是 bun 自己的 `bun.lock` 与 bun 的全局缓存。
          package-manager-cache: false

      - name: 装 Bun ${{ steps.tools.outputs.bun }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.tools.outputs.bun }}

      - name: 前端依赖
        working-directory: packages/web
        run: bun install --frozen-lockfile

      # 前端三道合一步：`mise.toml` 里它们是聚合任务 `web-ci`
      # （`depends = ["web-check", "web-test", "web-build"]`），而 `[tasks.ci]`
      # 的 depends 里写的就是 `web-ci` 这个名字。产线的步骤名必须与它对齐，
      # 否则 `check.sh` 的 C7 无法把「产线跑了哪些门禁」与「mise 定义了哪些」
      # 比对上——名字对不上时门禁只能靠人眼核，那就等于没有门禁。
      - name: web-ci（mise run web-ci）
        working-directory: packages/web
        run: |
          set -euo pipefail
          bun run type-check && bun run lint
          bun run test
          bun run build

      # 全 run 唯一一次前端构建/上传：覆盖率、build-frontend、build-binaries 都复用。
      - name: 校验 dist 非空
        working-directory: packages/web
        run: |
          set -euo pipefail
          test -f dist/index.html \
            || { echo "dist/index.html 不存在，前端构建产物是空的" >&2; exit 1; }
          ls -la dist | head -20

      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: packages/web/dist
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 1. 前端产物校验 —— 发布链的**硬前置，不是优化**
  # ---------------------------------------------------------------------------
  # `include_dir!` 在编译期把 `packages/web/dist` 嵌进 `afhub`。dist 缺失时
  # `crates/hub-server/build.rs` **不会失败**：它造一个占位页、打一条
  # `cargo:warning`，二进制照编。于是「Hub 装起来打开是 Not built 占位页」
  # 这种故障能一路走到用户手里而不红任何一步。所以：
  #   - build-binaries 必须 needs 本 job 并下载 artifact；
  #   - 下载后再断言 `packages/web/dist/index.html` 存在（见下面的「校验 dist」）。
  build-frontend:
    needs: [gate-static, gate-test, gate-coverage, gate-web]
    runs-on: ubuntu-24.04
    # 只读（同上）：编前端不上传任何发布物，artifact 走 Actions 内部存储，
    # 不需要仓库或包的写权限。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # dist 由 gate-web 编好；这里只取回并校验，绝不重复编译。
      - name: 取回前端产物
        uses: actions/download-artifact@v6
        with:
          name: web-dist
          path: packages/web/dist

      - name: 校验 dist 非空
        run: |
          set -euo pipefail
          test -f packages/web/dist/index.html \
            || { echo "packages/web/dist/index.html 不存在，构建产物是空的" >&2; exit 1; }
          ls -la packages/web/dist | head -20

  # ---------------------------------------------------------------------------
  # 2. 2 平台**原生**编译（不用交叉编译）
  # ---------------------------------------------------------------------------
  # 原生优先是 REX 的教训：交叉编 OpenSSL/zlib 会架构错配，而错配的症状是
  # 「二进制在目标机上跑不起来」，本地永远复现不了。GitHub 有 `ubuntu-24.04-arm`
  # runner，aarch64 直接原生编，所以矩阵里**每个条目都是原生**。
  #
  # **只编 musl（v0.7.3 用户裁定）**：`docs/DEVELOPMENT.md` §2 要求自包含二进制；
  # 本仓 `reqwest` 是 `rustls-tls`，不链系统 OpenSSL，剩下的 libc 由 musl 静态链
  # 解决（`ldd` 报 "not a dynamic executable"）。先前矩阵还编两份 gnu，但
  # Release 只发 musl 干净名、两个 `FROM scratch` 镜像也只 `COPY *-musl`——
  # gnu 产物**零消费方**，每次发布白编两套完整依赖图。用户原话「CI 不需要
  # gnu 和 musl 两种吧？浪费资源」，故删掉 gnu 两条，`scripts/check.sh` C10
  # 加断言钉死「矩阵里不许再出现 *-gnu」。
  #
  # ## 为什么没有 Windows（v0.7.1 不提供，不是「永远不支持」）
  #
  # 曾经有过 `x86_64-pc-windows-gnu` 一条，v0.7.1 首次真跑 CI 时 `exit code 101`：
  # `afcli` 依赖 `node-connector`，后者有 **81 处 `libc::` 调用**（`pty.rs` 27、
  # `exec.rs` 45、`files.rs` 4、`terminal.rs` 5），且不只是「顺手用了 libc」，
  # 而是执行模型本身建立在 Unix 语义上：
  #
  #   - 会话终端：`forkpty` + `ioctl(TIOCSWINSZ)`；
  #   - 一次性命令：`fork` + `pipe2(O_CLOEXEC)` + `dup2` + `execvpe` + `waitpid`；
  #   - 通道读超时：`poll` / `fcntl(F_GETFL|F_SETFL)` / `O_NONBLOCK`。
  #
  # **这些在 Windows 上不是「完全没有对应物」**——ConPTY（`CreatePseudoConsole`）
  # 就是 PTY 的对应物，`ResizePseudoConsole` 对应 `TIOCSWINSZ`。真正的障碍是
  # **Windows 没有 `fork`**：`exec.rs` 那套「fork 出子进程、在子进程里改 fd 再
  # exec」的模型在 Windows 上要整体换成 `CreateProcess` + 句柄重定向。所以这不是
  # 「加个矩阵条目、补个链接器」的量级，而是**先抽一层平台无关的 PTY/进程后端，
  # 再写两个实现**的移植工程，且 Windows 分支在 Linux 上测不了，得要 Windows runner。
  #
  # 对照 `REX`（同一作者的另一项目）为什么能在 `windows-latest` 上编：它的 16 个
  # crate 全是纯 `std` 的客户端/协议/命令行工具，**整个仓库没有一处 `forkpty`/
  # `openpty`/`TIOCSWINSZ`**，跑子进程只用跨平台的 `std::process::Command`。它没有
  # 面对过 PTY 移植问题，所以「REX 能编」不构成「本仓加了目标就能编」的证据。
  #
  # **v0.7.2 已经把那件事做完了**（平台抽象层 → ConPTY / `CreateProcess` 后端），
  # 桌面平台条目现在走下面独立的 `build-desktop` job——**不**加进本 job 的矩阵：
  # 本 job 编的是整个 workspace（`afhub` 仍 Linux-only），且下面那套自包含断言
  # 用 `readelf` / `ldd` / `file`，在 macOS 与 Windows 上都不存在。把桌面条目塞进来
  # 只会让每条发布都红，而报错看起来像「缺链接器」，人会去改 mingw 安装步骤，
  # 查错方向完全错。
  build-binaries:
    needs: [gate-static, gate-test, gate-coverage, gate-web, build-frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            suffix: linux-amd64-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            suffix: linux-arm64-musl
    runs-on: ${{ matrix.os }}
    # 只读（同上）：编二进制并上传 artifact，不碰仓库与包。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: 读工具链版本（mise.toml [tools] 是唯一出处）
        id: tools
        run: |
          set -euo pipefail
          v=$(sed -nE 's/^rust = "([^"]+)".*/\1/p' mise.toml | head -1)
          [ -n "$v" ] || { echo "mise.toml 里读不到 rust 的版本" >&2; exit 1; }
          echo "rust=$v" >> "$GITHUB_OUTPUT"

      - name: 装 Rust ${{ steps.tools.outputs.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.tools.outputs.rust }}
          targets: ${{ matrix.target }}

      - name: 装工具链版本缓存（cargo 编译产物按 Cargo.lock 键控）
        uses: Swatinem/rust-cache@v2
        with:
          # 对齐 REX：按 target 一份稳定缓存，避免每个发布矩阵从零编译依赖图。
          shared-key: build-${{ matrix.target }}
          save-if: true

      # matrix 里两条目标都是 musl：musl 目标的链接器 (`musl-gcc`)
      # 不在 runner 镜像里。按目标装，不要无脑全装（多装的东西会在别的 runner
      # 上装不上，把「矩阵某一条红」变成「所有条目红」）。
      - name: 装目标链接器
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            *-musl)
              sudo apt-get update -qq
              # `binutils` 是 `readelf` 的来源。它随 gcc 一起被拉进来，但
              # **不要依赖这个隐式关系**：下面 PIE 判据用 `readelf`，缺了它
              # 再配上 `2>/dev/null`，`grep` 拿到空输入就静默通过——断言
              # 变成永远绿。显式声明依赖比赌 runner 镜像的内容便宜。
              sudo apt-get install -y -qq musl-tools binutils
              echo "CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER=musl-gcc" >> "$GITHUB_ENV"
              # **必须关 PIE**。Rust 的 `*-linux-musl` 目标默认产 PIE，产物
              # 因此带上 `interpreter /lib/ld-musl-*.so.1`，即「静态编进了
              # 一份 musl、运行时又去找系统那份 musl loader」。两者版本不匹配
              # 时，进程在 `arch_prctl(ARCH_SET_FS)` 之后立刻 SIGSEGV——
              # strace 显示 `si_code=SI_KERNEL, si_addr=NULL`，日志一行都没有。
              # 这在容器里表现为「镜像起来就退，什么都不打印」，极难定位。
              # 本机已用 hello-world 复现：不开这两个 flag，连 `println!` 都崩。
              echo "RUSTFLAGS=-C relocation-model=static -C link-arg=-no-pie" >> "$GITHUB_ENV"
              ;;
          esac

      # 前端产物落在 build.rs 推算的位置（`crates/hub-server/../../packages/web/dist`）。
      - name: 取回前端产物
        uses: actions/download-artifact@v6
        with:
          name: web-dist
          path: packages/web/dist

      # 与 build-frontend 里那条同源：artifact 传丢了 / 解错路径时，
      # 没有这一步的后果是编出一个内嵌占位页的 Hub，而所有步骤都是绿的。
      - name: 校验 dist（include_dir! 的输入）
        run: |
          set -euo pipefail
          test -f packages/web/dist/index.html \
            || { echo "packages/web/dist/index.html 不在位，拒绝编出内嵌占位页的二进制" >&2; exit 1; }

      - name: 编译 release 二进制
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # 自包含断言（REX 的教训：产出一个动态链接的二进制，到了目标机上
      # 找不到 libssl 才炸）。本仓只编 musl，判据是：**静态且非 PIE**——
      # `ldd` 说静态只是必要条件，PIE 产物 `ldd` 同样报 "statically linked"，
      # 却带 `interpreter` 会在运行时段错误；所以还要查 `readelf -l` 无
      # `interpreter`、`file` 不报 `pie executable`（见下面完整判据）。
      - name: 断言二进制自包含 / 不依赖 OpenSSL
        run: |
          set -euo pipefail
          for bin in afhub afcli; do
            f="target/${{ matrix.target }}/release/${bin}"
            test -f "$f" || { echo "缺少产物 $f" >&2; exit 1; }
            case "${{ matrix.target }}" in
              *-linux-musl)
                # 先捕获输出再判内容，**不看 `ldd` 的退出码**：实测 `ldd` 对
                # 静态二进制返回 **rc=1**（本机已验：输出 "not a dynamic
                # executable"、rc=1）。写成 `ldd "$f" || { exit 1; }` 会把
                # 「正确的静态产物」判成失败，然后人去改构建配置——查错方向
                # 完全错。两种表述都接受：glibc 的 `ldd` 说 "not a dynamic
                # executable"，musl 系工具链常输出 "statically linked"。
                ldd_out=$(ldd "$f" 2>&1 || true)
                case "$ldd_out" in
                  *"not a dynamic executable"*|*"statically linked"*)
                    echo "OK $f: 静态"
                    ;;
                  *)
                    echo "FAIL $f: musl 目标必须静态，ldd 实际输出:" >&2
                    echo "$ldd_out" | head -5 >&2
                    exit 1
                    ;;
                esac
                # `ldd` 说静态还不够：**PIE 产物 `ldd` 也报 "statically linked"**，
                # 却因为 ELF 里带了 `interpreter` 而在运行时段错误，容器里表现为
                # 「起来就退，什么都不打印」。原因与复现见上面装链接器那步。
                #
                # 判据直接查 ELF 有没有 PT_INTERP，而不是 `ldd` 的措辞、也不靠
                # 执行：两个二进制都没有 `--version` 子命令（`afhub --version`
                # 会当普通参数忽略并**真启动**，连库开端口），拿它当探针会把
                # CI 卡在启动上。
                # `readelf` 缺了必须**当场红**，不能让它和 `2>/dev/null` 串成
                # 「没有输出 → grep 不命中 → 判通过」。
                command -v readelf >/dev/null \
                  || { echo "readelf 缺失（binutils 未装），PIE 判据无法执行" >&2; exit 1; }
                if readelf -l "$f" | grep -q 'interpreter'; then
                  echo "FAIL $f: musl 产物带 interpreter（PIE 未关），运行时会段错误" >&2
                  readelf -l "$f" | grep 'interpreter' >&2
                  exit 1
                fi
                # 纯静态 + 无 PIE 时 `file` 报 "executable"；带 PIE 时报
                # "pie executable"。两个条件都查，防止将来换工具链后
                # readelf 的字段名变化让断言静默失效。
                if file "$f" | grep -q 'pie executable'; then
                  echo "FAIL $f: musl 产物仍是 PIE" >&2
                  file "$f" >&2
                  exit 1
                fi
                echo "OK $f: 静态且非 PIE"
                ;;
              *)
                echo "FAIL 矩阵里出现了非 musl 目标：${{ matrix.target }}" >&2
                exit 1
                ;;
            esac
          done

      - name: 收集产物（按平台后缀命名）
        run: |
          set -euo pipefail
          mkdir -p out
          for bin in afhub afcli; do
            cp "target/${{ matrix.target }}/release/${bin}" \
               "out/${bin}-${{ matrix.suffix }}"
          done
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          # artifact 名带 target，纯为排错时能一眼看出是哪条矩阵红
          name: bin-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2b. 桌面平台（v0.7.2）：只编 `afcli`，**不进 Docker 镜像**
  # ---------------------------------------------------------------------------
  # 与上面 `build-binaries` 分开是结构上必须的，不是图省事：
  #
  #   - 那里编 `--workspace`，而 `afhub` 仍 **Linux-only**（v0.7.2 只移植设备侧）；
  #   - 那里的自包含断言用 `readelf` / `ldd` / `file`，macOS 与 Windows 上都没有
  #     这些工具（Windows 上 `ldd` 是「找不到 libltdl」的另一种东西）；
  #   - 那里的 `RUSTFLAGS`（musl 的 `-no-pie`）对桌面目标没有意义。
  #
  # ## 为什么 Windows 用 `x86_64-pc-windows-msvc` 而不是 gnu
  #
  # `windows-latest` 自带的是 MSVC 工具链；gnu 目标要额外装 mingw，而且
  # `windows-sys` 的 `CreatePseudoConsole` / `CreateProcessW` 那批导入在 gnu
  # 下的链接行为没有在 CI 上验过。MSVC 是 Windows 的默认生产工具链。
  #
  # ## macOS 为什么是 `macos-latest`（arm64）
  #
  # 对齐 REX 的 CI：macOS 条目统一 `macos-latest`（Apple Silicon 原生 runner），
  # `aarch64-apple-darwin` 直接原生编。固定 `macos-14` 曾触发 runner 配置被拒。
  # Intel runner 在退役时间表上，**所以 macOS 目前只发 arm64**。
  build-desktop:
    # **不**等 `build-frontend`：前端 dist 是 `hub-server` 的编译期输入
    # （`include_dir!`），而这里只编 `node-cli`。多等一个 job 不只是慢——
    # 它会让「前端挂了」看上去像「桌面构建有问题」，排错方向直接错。
    needs: [gate-static, gate-test, gate-coverage, gate-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-amd64
            ext: .exe
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: 装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # 与 Linux 矩阵分开缓存；test-desktop 用同一 key 只读复用 release 依赖图。
          shared-key: desktop-${{ matrix.target }}
          save-if: true

      # **只编 `-p node-cli`**，不 `--workspace`：`afhub` 在非 Linux 上编不过，
      # 而那不是本里程碑要解决的问题。写成 `--workspace` 会让这条 job 永远红。
      - name: 编译 afcli（release）
        run: cargo build --release -p node-cli --target ${{ matrix.target }}

      # 产物存在性必须单独断言。少了它，`cargo build` 若因某个 `cfg` 把 bin
      # 目标整段编没了，下面 `copy` 会以「文件不存在」失败——报错指向 copy，
      # 人会去怀疑路径，而不是「这个目标根本没产出」。
      - name: 断言 afcli 产物在位
        shell: bash
        run: |
          set -euo pipefail
          f="target/${{ matrix.target }}/release/afcli${{ matrix.ext }}"
          test -f "$f" || { echo "缺少产物 $f" >&2; ls -la "target/${{ matrix.target }}/release" >&2; exit 1; }
          echo "OK $f"

      - name: 收集产物（按平台后缀命名）
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "target/${{ matrix.target }}/release/afcli${{ matrix.ext }}" \
             "out/afcli-${{ matrix.suffix }}${{ matrix.ext }}"
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: bin-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2c. 桌面平台测试（v0.7.2）：**唯一**能验证 ConPTY 真行为的地方
  # ---------------------------------------------------------------------------
  # 这一条不是「顺便跑个测试」，而是本里程碑的核心验收手段：PTY 与进程后端
  # 在 Linux 上只能验「纯逻辑」（`win_command` 的引号/环境块，那边有单测），
  # 真正的 `CreatePseudoConsole` / `CreateProcessW` / 句柄继承 / 读流时序
  # 只能在真 Windows 上跑。没有这条 job，Windows 支持的证据就只有
  # 「交叉 `cargo check` 过了」，而那**证明不了**读得到输出。
  #
  # macOS 同样在这里跑：它虽然是 Unix，但 `pipe_nonblocking_cloexec` /
  # `macos_aware_execvpe` / `platform_forkpty` 三处都是 macOS 特有分支，
  # 在 Linux 上走不到。
  test-desktop:
    needs: [build-desktop]
    # 挂死要**快速红**，不能等 GitHub 的 6 小时默认超时：v0.7.2 的 Windows
    # job 曾卡 53m51s 才被取消，release 因此 0 秒跳过、产物没发出去。
    # macOS 实测 1m38s，Windows 修好后同量级，20 分钟足够留余量。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: 装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # 等 build-desktop 写完缓存后只读；与产物构建共用 release 依赖图。
          shared-key: desktop-${{ matrix.target }}
          save-if: false

      # 跑 `node-connector` 的**全部**测试（含集成测试）。这是 PTY / exec /
      # files 三个模块的平台行为判据，`--all-targets` 把单测与集成测试一起带上。
      #
      # 不加 `--no-fail-fast`：第一次红就该停下来看，而不是让 200 条测试各自
      # 报一遍同样的错把人淹掉。
      - name: 跑 node-connector 测试
        run: cargo test --release -p node-connector --all-targets --target ${{ matrix.target }}

  # ---------------------------------------------------------------------------
  # 3a. Hub 镜像 —— 前端已在编译期嵌进去，镜像里**不放 dist**
  # ---------------------------------------------------------------------------
  # 镜像里另放一份 dist 会让「单二进制」这条硬需求变成「两份真相源」，
  # 而 `include_dir!` 到底有没有生效从此没人验证：镜像跑起来页面是对的，
  # 但你分不清是嵌进去的还是旁边那份。所以镜像只拷二进制。
  #
  # 用 amd64 的 **musl** 二进制：静态，`FROM scratch` 也不缺 libc。
  # 因此镜像同时是 amd64 与 arm64 多架构清单的底座——arm64 那份用
  # `--platform` 拉对应的 arm64-musl 产物（buildx 的 TARGETARCH 分支见下）。
  docker-hub:
    needs: [gate-static, gate-test, gate-coverage, gate-web, build-binaries, build-desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 每个 artifact 里是**该平台的两个二进制**（afhub + afcli）：
      # Hub 镜像两个都要（afcli 供设备从 Hub 拉取，见 Dockerfile.hub 的说明）。
      - name: 取回 amd64 产物
        uses: actions/download-artifact@v6
        with:
          name: bin-x86_64-unknown-linux-musl
          path: dist/amd64

      - name: 取回 arm64 产物
        uses: actions/download-artifact@v6
        with:
          name: bin-aarch64-unknown-linux-musl
          path: dist/arm64

      # **全平台 afcli 进 Hub 镜像**（v0.7.2 子任务 7）：`DEVELOPMENT.md` §2 的
      # 发布形态是「Hub 镜像内嵌全部 arch 的 afcli」，供设备**从 Hub 拉二进制**
      # 而不是直连 GitHub（`security-and-lifecycle.md` §7.1.4）。v0.7.2 之前
      # 只有 Linux 两个架构，所以那句话其实只对了一半；现在补上桌面两份。
      #
      # 注意：这两个 artifact 是 `build-desktop` 产的，与上面两个 Linux 的
      # 目录结构不同——那边每个 artifact 只有一个 afcli（afhub 不跨平台）。
      - name: 取回桌面 afcli（windows-amd64）
        uses: actions/download-artifact@v6
        with:
          name: bin-x86_64-pc-windows-msvc
          path: dist/windows-amd64

      - name: 取回桌面 afcli（macos-arm64）
        uses: actions/download-artifact@v6
        with:
          name: bin-aarch64-apple-darwin
          path: dist/macos-arm64

      - name: 校验全部产物都在位
        run: |
          set -euo pipefail
          # Linux 两份是**本镜像的底座**（afhub 进 `/usr/local/bin`），缺一不可。
          for f in dist/amd64/afhub-linux-amd64-musl dist/amd64/afcli-linux-amd64-musl \
                   dist/arm64/afhub-linux-arm64-musl dist/arm64/afcli-linux-arm64-musl; do
            test -f "$f" || { echo "缺少 $f" >&2; exit 1; }
            chmod +x "$f"
          done
          # 桌面两份只作为「设备来拉」的载荷，不执行，所以不 chmod +x：
          # 给一个 .exe 加执行位没有意义，而 macOS 二进制在 Linux 上加了执行位
          # 也跑不了；`chmod` 反而让人以为镜像里会去跑它们。
          for f in dist/windows-amd64/afcli-windows-amd64.exe dist/macos-arm64/afcli-macos-arm64; do
            test -f "$f" || { echo "缺少 $f" >&2; exit 1; }
          done
          ls -la dist/amd64 dist/arm64 dist/windows-amd64 dist/macos-arm64

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像 tag 与标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentfleet-hub
          # `latest` 只跟**正式** tag（不含 -rc / -beta），否则一次预发就把
          # 所有 `docker pull :latest` 的人升到未定稿版本上。
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}

  # ---------------------------------------------------------------------------
  # 3b. afcli 镜像 —— 按 TARGETARCH 选二进制
  # ---------------------------------------------------------------------------
  docker-node:
    needs: [gate-static, gate-test, gate-coverage, gate-web, build-binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 两个 artifact 都整包取下（各含 afhub + afcli）；本 job 只用 afcli。
      - name: 取回 amd64 产物
        uses: actions/download-artifact@v6
        with:
          name: bin-x86_64-unknown-linux-musl
          path: dist/amd64

      - name: 取回 arm64 产物
        uses: actions/download-artifact@v6
        with:
          name: bin-aarch64-unknown-linux-musl
          path: dist/arm64

      - name: 校验两份产物都在位
        run: |
          set -euo pipefail
          for f in dist/amd64/afcli-linux-amd64-musl dist/arm64/afcli-linux-arm64-musl; do
            test -f "$f" || { echo "缺少 $f" >&2; exit 1; }
            chmod +x "$f"
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像 tag 与标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentfleet-node
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.node
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}

  # ---------------------------------------------------------------------------
  # 3c. GitHub Release + SHA256SUMS
  # ---------------------------------------------------------------------------
  release:
    needs:
      - gate-static
      - gate-test
      - gate-coverage
      - gate-web
      - build-frontend
      - build-binaries
      # 桌面产物进 Release（**不进 Docker 镜像**）：v0.7.2 的主题是设备侧
      # afcli 能装到 Windows / macOS 上，那没有附件就等于没做。
      - build-desktop
      # 发布前必须拿到桌面平台的测试结果。`build-desktop` 只证明「编得出」，
      # 这条才证明「跑得起来」——两个都要，缺一个都能发出一个装了打不开的包。
      - test-desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 取回全部二进制
        uses: actions/download-artifact@v6
        with:
          # 只要 bin-*，不要把 web-dist 也拉进发布包
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: 生成 SHA256SUMS
        run: |
          set -euo pipefail
          cd dist

          # 附件只发 **musl 静态**那份，并改成不带后缀的干净名。
          #
          # 两条理由：
          # 1. `FROM scratch` 镜像里没有 glibc（`Dockerfile.hub` / `Dockerfile.node`
          #    都 `COPY … -musl`），而 scratch 里唯一能跑的就是**依赖全打进二进制**
          #    的那份。用户下载物与容器原料取同一份，才不会出现「镜像能跑、下载的跑不了」
          #    这种两份真相源。
          # 2. 干净名（`afhub-linux-amd64`）去掉 `-musl` 后缀，是为了让人不必先懂
          #    glibc 与 musl 的区别就能选对；而且 v0.7.3 起 CI 只编 musl 这一份，
          #    附件里不会再出现「两种 libc 选哪个」的问题。
          #
          # `build-binaries` 的矩阵只有 musl 两条，gnu 产物不再被编出来：先前那
          # 两套 gnu 既不进 Release、也不进镜像，是每次发布白烧的编译资源。
          #
          # 桌面产物（`afcli-windows-amd64.exe` / `afcli-macos-arm64`）**原样
          # 保留**：它们没有 musl/gnu 之分，也没有 scratch 镜像要迁就，名字本身
          # 已经是干净的（不需要改名的那个理由在那里不成立）。
          mkdir -p ../out
          for f in *-musl; do
            clean="${f%-musl}"
            mv "$f" "../out/$clean"
          done
          # 桌面产物按 `afcli-<os>-<arch>[.exe]` 直接搬过去。用显式清单而不是
          # `afcli-*` 通配：通配会把将来多出来的东西（比如 `.dSYM`、`.pdb`）
          # 一起搬进 Release，而下面那条白名单断言用的是 `grep -v` 排除法，
          # 多出来的文件只能靠人看。
          for f in afcli-windows-amd64.exe afcli-macos-arm64; do
            test -f "$f" || { echo "缺少桌面产物 $f" >&2; ls -la >&2; exit 1; }
            mv "$f" "../out/$f"
          done
          cd ../out
          # **附件里不放 CHANGELOG.md**：它已经在仓库里（`CHANGELOG.md`），
          # Release 页面也直接链到仓库。再传一份只是多一个可能与仓库版本
          # 不一致的副本——用户下载到的 CHANGELOG 可能不是这个 tag 对应的那份
          # （tag 之后仓库里又改了 CHANGELOG，附件却还是旧的）。
          # Release body 里给仓库链接即可（见下）。
          # 安装脚本是例外：与本次产物同 tag 发布，供设备直接下载执行。
          cp ../install.sh ./install.sh
          chmod 0755 ./install.sh
          ls -la
          # 排序：`sha256sum *` 的顺序依赖文件系统，不同 runner 上不稳定，
          # 会让同一 tag 两次生成的 SUMS 内容不同（虽然都正确）。
          sha256sum $(ls | sort) > SHA256SUMS
          cat SHA256SUMS

      - name: 断言附件清单与写死的白名单完全一致
        run: |
          set -euo pipefail
          cd out
          # 上一步的 `*-musl` glob 若一个都没匹配到（产物命名将来变了），
          # 循环体不执行、`out/` 里什么都不剩，而下面的 `gh release create`
          # 照样会建出一个**没有二进制的 Release**——空发布比发布失败更难发现。
          n=$(ls afhub-linux-* afcli-linux-* 2>/dev/null | wc -l)
          if [ "$n" -ne 4 ]; then
            echo "FAIL 期望 4 个 Linux 二进制（afhub/afcli × amd64/arm64），实际 $n 个：" >&2
            ls -la >&2
            exit 1
          fi
          # 桌面产物必须真的在。少了它们，v0.7.2 的验收就成了「代码合了、
          # 用户下不到」——而这在附件列表里看不出来（Linux 那 4 个照旧齐）。
          for f in afcli-windows-amd64.exe afcli-macos-arm64; do
            test -f "$f" || { echo "FAIL 缺少桌面产物 $f" >&2; ls -la >&2; exit 1; }
          done
          # 名字里不许再出现 `-musl`：附件名必须是干净名，否则说明改名那步没生效。
          if ls | grep -q 'musl'; then
            echo "FAIL 附件里仍带 musl 后缀：$(ls | grep musl)" >&2
            exit 1
          fi
          # 附件清单是**写死**的：多一个或少一个都要红。
          # CHANGELOG.md 曾是附件之一，但它在仓库里已有一份（用户 2026-11-05 裁定
          # 不再上传），附件里那份可能是与仓库不一致的旧副本。
          extra=$(ls | grep -vE '^(afhub-linux-(amd64|arm64)|afcli-linux-(amd64|arm64)|afcli-windows-amd64\.exe|afcli-macos-arm64|SHA256SUMS|install\.sh)$' || true)
          if [ -n "$extra" ]; then
            echo "FAIL 附件里有预期之外的文件：$extra" >&2
            exit 1
          fi
          echo "OK 附件 = 4 个 Linux 干净名 + 2 个桌面产物 + install.sh + SHA256SUMS"

      # 前端 `dist/` **不进** Release，这是有意的：
      # 前端是 `include_dir!` 在编译期嵌进 `afhub` 的（`Dockerfile.hub` 也刻意
      # 不放 dist）。单独发一份前端会出现「两份真相源」——用户改了 dist 却不生效，
      # 因为真正服务的是嵌在二进制里那份。要部署前端就用 `afhub`，别发第二份。

      # 从 CHANGELOG.md 抽当前版本段做 Release body。
      # **抽不到就 fail**：一份空 body 的 Release 比没有 Release 更糟——
      # 用户会以为「这个版本没什么可说的」，而真相是流水线没找到条目。
      - name: 从 CHANGELOG 抽 Release body
        id: notes
        run: |
          set -euo pipefail
          # `v0.7.1` → `0.7.1`
          ver="${RELEASE_TAG#v}"
          body=$(awk -v v="$ver" '
            # 段头形如 `## [0.7.1] - 2026-11-05`
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            # 下一个二级标题即结束（`## [Unreleased]` / 上一个版本）
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md 里找不到 [${ver}] 段；拒绝发出空 body 的 Release" >&2
            exit 1
          fi
          {
            printf '%s\n\n' "$body"
            # 链接指到**仓库里那一份** CHANGELOG（附件里不再带它）。
            printf '**Full changelog / 完整变更**：[CHANGELOG.md](%s/blob/%s/CHANGELOG.md)\n' \
              "${{ github.server_url }}/${{ github.repository }}" "$RELEASE_TAG"
          } > release-body.md
          echo "----- body -----"
          head -40 release-body.md

      # 手动补发时 Release 可能已存在，`create` 会红；先决定用 create 还是 upload。
      #
      # `--latest` / `--prerelease` 必须显式给，不能靠 gh 的「automatic」：
      # 自动判据是「按日期和版本号挑一个」，它对**预发 tag** 没有概念——一个
      # `v0.8.0-rc.1` 只要建得比 `v0.7.1` 晚、版本号更大，就会被标成 Latest，
      # 于是所有从 GitHub Releases 页面进来的人看到的「最新版」是个未定稿。
      # 这与上面的镜像 `latest` 判据（`!contains(ref_name, '-')`）必须是**同一套**
      # 规则：两处判据不一致时，`docker pull :latest` 和 Releases 页面会指向不同
      # 版本，而两者都自称「最新」。
      - name: 发布 Release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 预发判据与镜像 `latest` 完全相同：tag 里带 `-` 即预发。
          # 写成 `*'-'*` 而不是 `*-rc*` / `*-beta*`，是因为 semver 的预发段可以
          # 是任意标识符（`-alpha.2`、`-nightly`），列举一定漏。
          if [[ "$RELEASE_TAG" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          echo "RELEASE_TAG=$RELEASE_TAG 稳定版=$stable"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，改为覆盖资产并订正标记"
            gh release upload "$RELEASE_TAG" out/* --clobber
            # 补发路径也必须订正标记：一个早先被自动判成 Latest 的预发版，
            # 只上传资产不会改掉它的 Latest 身份，得显式改回来。
            if [ "$stable" = true ]; then
              gh release edit "$RELEASE_TAG" --latest
            else
              gh release edit "$RELEASE_TAG" --prerelease --latest=false
            fi
          else
            flags=()
            if [ "$stable" = true ]; then
              flags+=(--latest)
            else
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" out/* \
              --title "$RELEASE_TAG" \
              --notes-file release-body.md \
              --verify-tag \
              "${flags[@]}"
          fi

      - name: 断言 Latest 与预发标记正确
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `RELEASE_TAG` 是 **workflow 顶层 env**（第 40 行：`github.event.inputs.tag || github.ref_name`），
          # 不是上一步的 output——上一步只输出了 `stable`（见 `steps.rel.outputs.stable`）。
          # 之前这里写 `steps.rel.outputs.tag` 会取到空串，`releases/tags/` 后面
          # 变成空路径，`gh api` 报错——**空值不会自己显形**。
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          # 发布完再读回来核一遍：`--latest` 是远端状态，命令成功不等于它生效。
          # 这一段是 `latest` 只跟正式 tag 这条承诺的**唯一机器可验证据**——
          # 没有它，「镜像 latest 与 Release Latest 用同一套判据」只是注释里的说法。
          #
          # **不能用 `gh release view --json isLatest`**：gh CLI 的
          # `release view --json` 字段表里**根本没有 `isLatest`**（只有
          # `isPrerelease` / `isDraft` / `tagName` 等），带上它 gh 直接报
          # `Unknown JSON field: "isLatest"` 并以非零码退出——在
          # `set -euo pipefail` 下整步红。v0.7.1 的 release 步首次真跑到
          # 就是这么红的（CI run 42043667668）：前面的门禁先红，release
          # 步一直没被真执行过，缺陷藏着。
          # 「是不是 Latest」只能从 **REST API** 问：`releases/latest`
          # 按 GitHub 的定义只返回**最新的非预发、非草稿**发布。
          #
          # 于是判据变成两个可独立验证的事实，而不是一个自造字段：
          #   ① 预发标记对不对 → `releases/tags/<tag>` 的 `prerelease` 布尔；
          #   ② 是不是 Latest     → `releases/latest` 的 `tag_name` 是不是本 tag。
          # 稳定版两条都要成立；预发版 ① 必须是 true、② **必须不成立**
          # （预发版永远不该占据 Latest 位置）。

          # ① 预发标记：REST 的 `prerelease` 字段。
          pre=$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" \
                  --jq '.prerelease')
          echo "远端 prerelease = $pre"

          # ② Latest 归属：`releases/latest` 只返回最新的非预发发布。
          # 一个预发版可能让这个接口 404（还没有任何正式发布），
          # 那种情况下「不是 Latest」成立，不能因此让整步红。
          latest_tag=$(gh api "repos/${{ github.repository }}/releases/latest" \
                        --jq '.tag_name' 2>/dev/null || echo "<none>")
          echo "远端 releases/latest 的 tag = $latest_tag"

          if [ "${{ steps.rel.outputs.stable }}" = true ]; then
            if [ "$pre" != "false" ]; then
              echo "FAIL $RELEASE_TAG：稳定版的 prerelease 必须是 false，实际 $pre" >&2
              exit 1
            fi
            if [ "$latest_tag" != "$RELEASE_TAG" ]; then
              echo "FAIL $RELEASE_TAG：稳定版必须占据 releases/latest，实际是 $latest_tag" >&2
              exit 1
            fi
          else
            if [ "$pre" != "true" ]; then
              echo "FAIL $RELEASE_TAG：预发版的 prerelease 必须是 true，实际 $pre" >&2
              exit 1
            fi
            if [ "$latest_tag" = "$RELEASE_TAG" ]; then
              echo "FAIL $RELEASE_TAG：预发版不得占据 releases/latest" >&2
              exit 1
            fi
          fi
          echo "OK $RELEASE_TAG：Latest 标记与预发标记符合判据"
