[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[env]
# 本仓库的测试**必须单线程跑**。这不是偏好，是这批用例的构造决定的：
#
# 被并行踩到的进程级共享状态至少四处——通道表（`channel.rs` 的进程级单例）、
# 本进程环境（`pty` 的 `spawn_in` 读 `std::env::vars()`，而用例会 `set_var`）、
# PATH 探测（`detect.rs`）、以及真 PTY 的 fd/子进程资源。它们在并行执行下
# 表现为**随机红**，且红的样子极具误导性：报错是「新键要被追加进去：<空>」，
# 看起来像 env 合并逻辑坏了，实际是对面根本没拿到 CPU 时间片读完。
#
# 曾经的做法是「记得手动加 `--test-threads=1`」，但 `mise run test`、
# 覆盖率门禁（`cargo llvm-cov` 底层也是 `cargo test`）与 CI 都直接跑
# `cargo test --workspace`，
# 没人记得住——于是门禁在多核机上必红，而「必红的门禁」等于没有门禁。
# 所以默认值写在这里（`RUST_TEST_THREADS` 是 libtest 认的环境变量原话）。
#
# `RUST_TEST_THREADS` 是 **libtest** 认的变量，作用域是**单个测试二进制内部**
# 的线程数。`cargo test --workspace` 仍会**并行跑多个测试二进制**（那是 cargo
# 的 target 并行度，不是 libtest 的），下面这行管不到。所以它保证的是「同一
# 个套件里不互相踩」，不是「全仓串行」——跨套件的共享状态必须另行隔离
# （本里程碑已把四处跨套件共享源全部改成各自隔离）。
#
# 另外：本机 3.7 GiB 零 swap，**不要跑 `cargo test --workspace`**——同时链接并
# 运行多个测试二进制会 OOM。按 crate 分开跑。
#
# 代价是全量测试从约 12 秒变成约 34 秒。这个代价换的是「红就是真红」。
RUST_TEST_THREADS = "1"
