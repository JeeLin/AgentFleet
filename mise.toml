# mise 项目配置：工具链与任务
#
# 原则（按工具分档，不是一刀切）：
#
# - **rust / node 钉死**。`rust` 尤其不能浮动：`cargo llvm-cov` 的覆盖率数值跨
#   工具链不可比，而覆盖率门禁是**精确比对**（685 vs 685 那种），换一次编译器就
#   整表漂移；clippy 也吃 `-D warnings`，新版加一条 lint 就让主干凭空变红，而
#   没有人改过代码。`node` 同理——vue-tsc / eslint / vite 的产物与它对版本敏感。
# - **bun 跟 `latest`**。它的依赖版本由 `packages/web/bun.lock` 锁住（已入库），
#   所以依赖面不漂；剩下的风险只有「bun 自己改了 `bun run build` 的产物格式」，
#   而这会被 CI 的 `web-ci` 当场发现，代价是一次可回退的升级而不是一次静默劣化。

[tools]
# 顺序与项目一致：node / bun / rust。
node = "24"
bun = "latest"
# 钉死：覆盖率与 clippy 门禁要求同一份代码换个时间跑出同样的结果。
# 升级时显式改这个数字，**不要**改成 `stable`——`stable` 不是「更新的版本」，
# 只是「不固定的版本」。`.github/workflows/release.yml` 的 `gate` 直接读本值。
rust = "1.99.0"

# 数据目录钉在仓库内，不落 `~/.local/share/agentfleet/`（`dirs::data_dir()` 的缺省）。
# 那个缺省是给生产部署用的：开发时换个 checkout、清个缓存，dev 库与 setup token
# 就不知道跑哪去了，而 setup token 只在首次启动打印一次。
# `.gitignore` 已忽略 `/data/`。
[env]
AFHUB_DATA_DIR = "{{config_root}}/data"

# ---------------------------------------------------------------------------
# 任务：把 AGENTS.md 的质量门禁固化成可执行命令，避免每次手打一串
# ---------------------------------------------------------------------------

[tasks.check]
description = "grep 门禁：依赖收敛 / 命名合规 / 文档锚点"
run = "scripts/check.sh"

[tasks.fmt]
description = "格式检查"
run = "cargo fmt --check"

[tasks.lint]
description = "clippy，零 warning"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "全部测试"
run = "cargo test --workspace"

[tasks.cov]
description = "覆盖率汇总（只打印数值，不阻塞；阻塞门禁见 cov-gate）"
run = "cargo llvm-cov --workspace --all-targets --summary-only"

[tasks.cov-detail]
description = "覆盖率明细：找出未覆盖的行"
run = "cargo llvm-cov --workspace --all-targets"

# 覆盖率门禁：唯一**有阻塞力**的覆盖率检查。
# `cov` 只是打印数值（`--summary-only` 不带 `--fail-under-lines`，退出码与覆盖率无关），
# 真正把「零未登记未覆盖行」当门禁的是这个任务：它跑 `cargo llvm-cov --show-missing-lines`
# 并与 coverage-exceptions.txt 双向核对（未覆盖未登记 = 失败；登记了已覆盖 = 过期例外 = 失败）。
# 需要 ≥6 GiB 空闲磁盘（脚本自己会 FATAL 提示）。
[tasks.cov-gate]
description = "覆盖率门禁：零未登记未覆盖行 + 例外双向核对（AGENTS.md 覆盖率门禁）"
run = "scripts/check-coverage.sh"

# 例外理由的锚点核对：每条登记的理由必须落在源码里就近的
# `// coverage: excluded` 就地标注上（或该行在 `#[cfg(test)]` 块内）。
# **不跑 cargo**，秒级，所以进 CI 门禁链。
[tasks.cov-anchors]
description = "覆盖率例外理由的锚点核对（秒级，不跑 cargo）"
run = "scripts/coverage-exceptions.sh --check"

[tasks.ci]
description = "本地全量门禁 = check + fmt + lint + test + cov-gate + cov-anchors + web-ci"
depends = ["check", "fmt", "lint", "test", "cov-gate", "cov-anchors", "web-ci"]

# ---- 开发环境 ---------------------------------------------------------------

[tasks.dev-hub]
description = "Hub（8080），改 Rust 即重编重启"
run = """
command -v cargo-watch >/dev/null || { echo "缺少 cargo-watch：cargo install cargo-watch" >&2; exit 1; }
cargo watch -x 'run -p hub-server' -w crates/hub-server -w crates/hub-core -w crates/hub-storage -w crates/identity -w crates/protocol
"""

[tasks.dev-web]
description = "Vite 开发服务器（3002），文件改动即时热更新"
run = "cd packages/web && bun run dev"

# 跑设备侧二进制（开发调试用）：`mise run cli`，改 Rust 即重编重启。
#
# 与 `dev-hub` 同构。**不能带参数**：mise 把 `-- xxx` 字面追加到 run 的最后一行，
# 而 cargo-watch 会把它当成 trail 命令（`log -n 50` 会被它当可执行文件跑）。
# 一次性命令走 `cli-log`。
[tasks.cli]
description = "设备侧 afcli（watch）：改 crates/ 即重编重启，对齐 dev-hub"
env = { AFCLI_HUB_URL = "ws://127.0.0.1:8080/ws", AFCLI_DATA_DIR = "{{config_root}}/data/node" }
run = """
command -v cargo-watch >/dev/null || { echo "缺少 cargo-watch：cargo install cargo-watch" >&2; exit 1; }
exec cargo watch -x 'run -p node-cli -- run' -w crates/node-cli -w crates/node-core -w crates/protocol -w crates/identity
"""

# 一次性命令（不经 watch）：`mise run cli-log -- -n 50`。
[tasks.cli-log]
description = "设备侧 afcli 一次性命令（读日志等）：mise run cli-log -- -n 50"
env = { AFCLI_HUB_URL = "ws://127.0.0.1:8080/ws", AFCLI_DATA_DIR = "{{config_root}}/data/node" }
run = "exec target/debug/afcli log"

# 两个长驻进程并行：前端 3002 把 `/api` 与 `/ws` 转发到 Hub 8080。
#
# **必须是 `depends` 而不是 `run = [...]`**：后者是**顺序**执行，而 `dev-hub`
# 是长驻的 watch 进程、永不返回，前端永远轮不到启动。
[tasks.dev]
description = "本地开发：Hub watch（8080）+ 前端热更新（3002），前端转发请求到 Hub"
depends = ["dev-hub", "dev-web"]

# ---- 前端四道门禁（`packages/web`）-----------------------------------------
[tasks.web-check]
description = "前端 type-check + lint"
run = """
cd packages/web && bun run type-check && bun run lint
"""

[tasks.web-test]
description = "前端单测（vitest）"
run = """
cd packages/web && bun run test
"""

[tasks.web-build]
description = "前端构建（vite build）"
run = """
cd packages/web && bun run build
"""

[tasks.web-ci]
description = "前端三道门禁 = web-check + web-test + web-build"
depends = ["web-check", "web-test", "web-build"]

[tasks.build]
description = "生产构建：先编译前端，再构建 release 二进制（Hub 内嵌 dist/）"
depends = ["web-build"]
run = "cargo build --release --workspace"

[tasks.start]
description = "运行生产构建产物（Hub 托管前端，单端口 8080）"
run = "./target/release/afhub"

# 交叉编译：树莓派一类设备（M0 子任务 0 测试⑦）
[tasks.check-arm64]
description = "aarch64 交叉编译检查"
run = "cargo check --target aarch64-unknown-linux-gnu --workspace"

[tasks.add-target]
description = "安装 aarch64 目标（一次性）"
run = "rustup target add aarch64-unknown-linux-gnu"
