# mise 项目配置：工具链与任务
#
# 原则：**工具链版本钉死**，不用 `latest`——否则换一次 stable 就重编译全树，
# 且 `cargo llvm-cov` 的覆盖率数值跨工具链不可比（覆盖率门禁要求可复现）。

[tools]
# 顺序与项目一致：node / bun / rust。版本钉死，不用 `latest`——
# 否则换一次 stable 就重编译全树，且 `cargo llvm-cov` 的覆盖率数值跨工具链
# 不可比（覆盖率门禁要求可复现）。
node = "24.21.0"
bun = "1.4.3"
# 与 CI 保持一致；升级时同步改 .github/workflows/ci.yml 与 README
rust = "1.99.0"

# 数据目录钉在仓库内，不落 `~/.local/share/agentfleet/`（`dirs::data_dir()` 的缺省）。
# 那个缺省是给生产部署用的：开发时换个 checkout、清个缓存，dev 库与 setup token
# 就不知道跑哪去了，而 setup token 只在首次启动打印一次。
# `.gitignore` 已忽略 `/data/`。
[env]
AFHUB_DATA_DIR = "{{config_root}}/data"

# ---------------------------------------------------------------------------
# 任务：把 AGENTS.md 的质量门禁固化成可执行命令，避免每次手打一串
# ---------------------------------------------------------------------------

[tasks.check]
description = "grep 门禁：依赖收敛 / 命名合规 / 文档锚点"
run = "scripts/check.sh"

[tasks.fmt]
description = "格式检查"
run = "cargo fmt --check"

[tasks.lint]
description = "clippy，零 warning"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "全部测试"
run = "cargo test --workspace"

[tasks.cov]
description = "覆盖率汇总（阈值 100%，见 AGENTS.md 覆盖率门禁）"
run = "cargo llvm-cov --workspace --all-targets --summary-only"

[tasks.cov-detail]
description = "覆盖率明细：找出未覆盖的行"
run = "cargo llvm-cov --workspace --all-targets"

[tasks.ci]
description = "本地全量门禁 = check + fmt + lint + test + cov + web-ci"
depends = ["check", "fmt", "lint", "test", "cov", "web-ci"]

# ---- 开发环境 ---------------------------------------------------------------

[tasks.dev-hub]
description = "Hub（8080），改 Rust 即重编重启"
run = """
command -v cargo-watch >/dev/null || { echo "缺少 cargo-watch：cargo install cargo-watch" >&2; exit 1; }
cargo watch -x 'run -p hub-server' -w crates/hub-server -w crates/hub-core -w crates/hub-storage -w crates/identity -w crates/protocol
"""

[tasks.dev-web]
description = "Vite 开发服务器（3002），文件改动即时热更新"
run = "cd packages/web && bun run dev"

# 跑设备侧二进制（开发调试用）：`mise run afcli -- run` / `-- log -n 50`。
#
# **为什么要 `shell = "bash"`**：mise 默认用 `sh` 执行 task，而 `sh` 没有数组，
# 于是「把带空格的参数原样传给 afcli」做不到——`log -n "a b"` 会被拆成两个参数。
# 数组那两行在 bash 下才成立，实测空格与退出码都保得住。
#
# **为什么用 `usage` 的 `var=#true` 而不是 `$@`**：`$@` 在 mise 的 task 里是空的
# （实测 `n=0`），参数只经 `usage_afcli_args` 这一个口子进来，且是一个**已 shell
# 引用过的字符串**——所以必须 `eval` 回数组再展开，直接 `$usage_afcli_args` 会把
# 带空格的单个参数拆成两个。
[tasks.afcli]
description = "跑设备侧 afcli（debug 构建）：mise run afcli -- run / -- log -n 50"
shell = "bash"
usage = '''
arg "[afcli_args]" help="传给 afcli 的参数，如 run、log -n 50" var=#true
'''
env = { AFCLI_HUB_URL = "ws://127.0.0.1:8080/ws" }
run = """
#!/usr/bin/env bash
set -euo pipefail
# 缺 debug 构建时先建，免得报一个「二进制不存在」让人猜要敲什么
if [[ ! -x target/debug/afcli ]]; then
  echo "target/debug/afcli 不存在，先 cargo build --bin afcli" >&2
  exit 1
fi
eval "args=(${usage_afcli_args:-})"
# `exec` 而不是调用：退出码与信号原样出去，Ctrl-C 直接作用于 afcli
# （多包一层 shell 会让 systemd / 手工调试时的退出码协议 0/10/11/12 看不出来）
exec target/debug/afcli "${args[@]}"
"""

# `afcli` 的 `--help` / `-h` **经这个 task 到不了**，这是 mise 与 afcli 两头合起来
# 的结果，不是哪一边的 bug：
#
# 1. 带 `usage` 的 task 会让 mise 的**任务参数解析器**把 `--help` 认成自己的 flag
#    （实测：`mise run afcli -- --help` 打的是 mise 的任务帮助，`afcli` 压根没被
#    启动，退出码 1）。`--` 分隔符也挡不住它——mise 2026.10.7 实测如此。
# 2. 想绕开 mise，就得写 `mise run afcli -- -- --help`，而 afcli 的
#    `parse_args` 把首位的 `--` 当未知子命令 → 打用法并**退出 1**。
#
# 所以要看用法请直接敲 `./target/debug/afcli --help`（或 `target/release/afcli`）。
# 其余全部可用：`run` / `run --worker` / `log` / `log -n N` / `--version` 都实测通过。

# 两个长驻进程并行：前端 3002 把 `/api` 与 `/ws` 转发到 Hub 8080。
#
# **必须是 `depends` 而不是 `run = [...]`**：后者是**顺序**执行，而 `dev-hub`
# 是长驻的 watch 进程、永不返回，前端永远轮不到启动。
[tasks.dev]
description = "本地开发：Hub watch（8080）+ 前端热更新（3002），前端转发请求到 Hub"
depends = ["dev-hub", "dev-web"]

# ---- 前端四道门禁（`packages/web`）-----------------------------------------
[tasks.web-check]
description = "前端 type-check + lint"
run = """
cd packages/web && bun run type-check && bun run lint
"""

[tasks.web-test]
description = "前端单测（vitest）"
run = """
cd packages/web && bun run test
"""

[tasks.web-build]
description = "前端构建（vite build）"
run = """
cd packages/web && bun run build
"""

[tasks.web-ci]
description = "前端三道门禁 = web-check + web-test + web-build"
depends = ["web-check", "web-test", "web-build"]

[tasks.build]
description = "生产构建：先编译前端，再构建 release 二进制（Hub 内嵌 dist/）"
depends = ["web-build"]
run = "cargo build --release --workspace"

[tasks.start]
description = "运行生产构建产物（Hub 托管前端，单端口 8080）"
run = "./target/release/afhub"

# 交叉编译：树莓派一类设备（M0 子任务 0 测试⑦）
[tasks.check-arm64]
description = "aarch64 交叉编译检查"
run = "cargo check --target aarch64-unknown-linux-gnu --workspace"

[tasks.add-target]
description = "安装 aarch64 目标（一次性）"
run = "rustup target add aarch64-unknown-linux-gnu"
