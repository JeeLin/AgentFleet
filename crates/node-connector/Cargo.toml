[package]
name = "node-connector"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# exec / files connector 的 base64 载荷编解码
base64ct.workspace = true
# terminal connector 的真 PTY：openpty / forkpty / execve / ioctl(TIOCSWINSZ)
libc.workspace = true
tokio = { workspace = true, features = ["full"] }

# 只在 Windows 上编（ConPTY / CreateProcess / SetFileTime），见 workspace 注释。
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
# connector 的沙箱测试要建临时工作区（exec / files / git 各自用）
tempfile.workspace = true

[lints]
workspace = true
