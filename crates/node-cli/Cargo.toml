[package]
name = "node-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "node_cli"
path = "src/lib.rs"

[[bin]]
name = "afcli"
path = "src/main.rs"

[dependencies]
node-core.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true
# 集成测试要当 WS 对端验「worker 握手后怎么读帧」，用现成的服务端脚手架。
tokio-tungstenite.workspace = true
futures-util.workspace = true
# 「被信号杀死」那条退出码映射要真的 spawn 一个进程自杀。
libc.workspace = true
# 子任务 4 的进程级测试要一台真 Hub：换 worker 期间「身份不变、Hub 不判离线」
# 这条承诺只能在真进程 + 真 Hub 上验证（单测里 spawn 自己等于递归起自己）。
hub-server.workspace = true
hub-core.workspace = true
hub-storage.workspace = true
axum.workspace = true
identity.workspace = true

[lints]
workspace = true