[package]
name = "hub-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hub_server"
path = "src/lib.rs"

[[bin]]
name = "afhub"
path = "src/main.rs"

[dependencies]
hub-core.workspace = true
hub-storage.workspace = true
protocol.workspace = true
identity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2.workspace = true
rand.workspace = true
bytes.workspace = true
# 启动期错误类型（BootstrapError）；Hub 启动失败必须中止进程而不是半初始化
thiserror.workspace = true
# 共享状态里的 Mutex（setup token 计数、登录闸门参数）。
# 用 parking_lot 而不是 std::sync::Mutex：后者有 poisoning，
# 而这里的状态只是计数器，poison 后 panic 一次就会把 Hub 带下去。
parking_lot.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
http-body-util.workspace = true
tempfile.workspace = true
libc.workspace = true
# 子任务 3 的 WS 集成测试：用产品自己的 node 侧客户端连 Hub，
# 而不是裸手搓一个——那样漏掉「两端字段对不上」这类问题。
node-core.workspace = true
identity.workspace = true
protocol.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
