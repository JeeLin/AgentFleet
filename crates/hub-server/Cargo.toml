[package]
name = "hub-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "hub_server"
path = "src/lib.rs"

[[bin]]
name = "afhub"
path = "src/main.rs"

[dependencies]
hub-core.workspace = true
hub-storage.workspace = true
protocol.workspace = true
identity.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
# 子任务 6：`include_dir!` 编译期嵌入 `packages/web/dist`（单二进制硬需求）
include_dir.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
argon2.workspace = true
rand.workspace = true
bytes.workspace = true
# 启动期错误类型（BootstrapError）；Hub 启动失败必须中止进程而不是半初始化
thiserror.workspace = true
# 共享状态里的 Mutex（setup token 计数、登录闸门参数）。
# 帧发送侧 / 每秒计数这类共享状态用 parking_lot：没有 poisoning 开销。
#
# **注意 `import_auth.rs` 刻意用 `std::sync::Mutex`**：它的状态是「已消费的
# nonce 集合」，中毒时必须继续拒绝服务（fail-closed）而不是 panic 或静默清空，
# 那里逐处 `let Ok(..) = .. else { return 401 }` 处理 poisoning。
parking_lot.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
http-body-util.workspace = true
tempfile.workspace = true
libc.workspace = true
# 子任务 3 的 WS 集成测试：用产品自己的 node 侧客户端连 Hub，
# 而不是裸手搓一个——那样漏掉「两端字段对不上」这类问题。
node-core.workspace = true
# Bug 22：端点测试要真的构造一次 CLI 的签名 body，逐字比字段顺序与摘要。
# 只在 dev-dependencies：Hub 生产依赖仍不含 node-cli / node-core。
node-cli.workspace = true
# 端点用例要重算 canonical body 的 SHA-256（`common/mod.rs` 的 `signed_import*`）。
# 生产代码不算摘要——它走 `ImportRequest::body_digest_hex()`（`identity`，
# 内部用 sha2），所以 sha2 只在 dev-dependencies：Hub 生产依赖不含它。
sha2.workspace = true
identity.workspace = true
protocol.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[lints]
workspace = true
