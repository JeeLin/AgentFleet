[package]
name = "node-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
protocol.workspace = true
identity.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
base64ct.workspace = true
sha2.workspace = true
dirs.workspace = true
# connector 与 PTY 搬到了 node-connector（v0.12.0 按需加载要靠 crate 边界）。
# 本 crate 只经注册表接口使用它们，不直接实现任何 connector。
node-connector.workspace = true
# `pty.rs` 搬走后生产代码不再直接用 libc；但 tests/ 里硬断连接（SO_LINGER）
# 仍需要它，所以它现在只出现在 dev-dependencies。
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
# 硬断连接（SO_LINGER(0) → RST）需要直接操作 socket：`Tail::Abrupt` 那条
# 「对端进程没了」的路径没有 RST 就构造不出来，只有「发了半个关闭握手」的近似。
libc.workspace = true
# 传输错误路径的集成测试需要一个可控的 WS 对端（连上后按脚本发坏帧 /
# Close / ping / 二进制）。tokio-tungstenite 的 `accept_async` 已在
# 普通依赖里，这里只是让测试用它当服务端。
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
identity.workspace = true
protocol.workspace = true

[lints]
workspace = true
